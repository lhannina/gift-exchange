<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Gift Exchange</title>
  <meta name="description" content="Our family gift exchange: draw names, share wishlists.">
  <meta name="theme-color" content="#173f30">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎁</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fraunces:opsz,wght@9..144,600;9..144,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip" href="#app">Skip to content</a>
  <div id="demo-banner" class="demo-banner" hidden></div>

  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">🎄</span>
        <span id="event-name">Gift Exchange</span>
      </div>
      <div class="top-actions">
        <span id="who" class="who"></span>
        <button id="textsize" class="top-btn" type="button"><span class="lvl">A</span><span class="lbl">Text size</span></button>
        <button id="signout" class="top-btn" type="button" hidden>Sign out</button>
      </div>
    </div>
  </header>

  <main id="app" tabindex="-1">
    <div class="loading" role="status"><span class="spinner" aria-hidden="true"></span>Loading…</div>
  </main>

  <nav id="tabs" class="tabs" aria-label="Main" hidden></nav>

  <div id="recaptcha-container"></div>
  <div id="modal-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <canvas id="confetti" aria-hidden="true"></canvas>

  <noscript><p style="padding:2rem;font-size:1.25rem">Please turn on JavaScript to use the gift exchange.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
